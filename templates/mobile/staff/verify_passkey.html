{% extends 'mobile/staff/base.html' %}
{% load static %}
{% block title %}Verify Passkey{% endblock %}
{% block body %}
<div class="card" style="max-width: 420px; margin: 42px auto 0;">
    <h2 style="margin: 0 0 8px;">Verify your passkey</h2>
    <p class="subtle" style="margin-bottom: 18px;">Use your device biometrics or security key to complete sign-in.</p>

    <div id="passkey-status" class="alert" style="color: #1d4ed8; background: rgba(59,130,246,.08);">
        Preparing secure passkey verification…
    </div>
    {% csrf_token %}

    <div style="margin-top: 16px;">
        <button type="button" id="verify-passkey-btn" class="btn-primary" style="width:100%; padding: .8rem 1rem; border-radius: .8rem; font-weight: 600;">Verify with Passkey</button>
    </div>
</div>

<script>
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return '';
    }

    function getCsrfToken() {
        return getCookie('csrftoken') || document.querySelector('[name="csrfmiddlewaretoken"]')?.value || '';
    }

    function base64UrlToUint8Array(value) {
        if (!value) throw new Error('Missing WebAuthn value.');
        const normalized = value.replace(/-/g, '+').replace(/_/g, '/');
        const pad = normalized.length % 4 === 0 ? '' : '='.repeat(4 - (normalized.length % 4));
        const binary = atob(normalized + pad);
        return Uint8Array.from(binary, (char) => char.charCodeAt(0));
    }

    function uint8ArrayToBase64Url(value) {
        let binary = '';
        value.forEach((byte) => {
            binary += String.fromCharCode(byte);
        });
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    async function ensureWebAuthnSupport() {
        if (!window.PublicKeyCredential || !navigator.credentials || !navigator.credentials.get) {
            throw new Error('This browser does not support native WebAuthn passkeys.');
        }
        if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            throw new Error('Passkeys require HTTPS or localhost.');
        }
    }

    async function parseJsonResponse(response, fallbackMessage) {
        const contentType = response.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
            const text = await response.text();
            throw new Error(text.includes('<!DOCTYPE') ? 'Session expired or the verification page was returned instead of JSON.' : (fallbackMessage || 'Passkey verification unavailable.'));
        }
        return response.json();
    }

    async function verifyWithPasskey() {
        const status = document.getElementById('passkey-status');
        const button = document.getElementById('verify-passkey-btn');
        if (!status || !button) return;
        if (button.dataset.inFlight === 'true') return;
        button.dataset.inFlight = 'true';
        button.disabled = true;

        try {
            await ensureWebAuthnSupport();
            const csrfToken = getCsrfToken();
            const username = '{{ username|escapejs }}';

            status.textContent = 'Requesting your passkey challenge…';
            const optionsResponse = await fetch('{% url "staff_webauthn_authentication_options" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({ username: username || '' })
            });

            if (!optionsResponse.ok) {
                const error = await parseJsonResponse(optionsResponse, 'Passkey verification unavailable.').catch(() => ({ error: 'Passkey verification unavailable.' }));
                throw new Error(error.error || 'Passkey verification unavailable.');
            }

            const options = await parseJsonResponse(optionsResponse, 'Passkey verification unavailable.');
            const publicKey = {
                challenge: base64UrlToUint8Array(options.challenge),
                timeout: options.timeout,
                allowCredentials: (options.allowCredentials || []).map((item) => ({
                    ...item,
                    id: base64UrlToUint8Array(item.id)
                })),
                userVerification: options.userVerification || 'preferred'
            };

            const credential = await navigator.credentials.get({ publicKey });
            const payload = {
                id: credential.id,
                rawId: uint8ArrayToBase64Url(new Uint8Array(credential.rawId)),
                type: credential.type,
                response: {
                    authenticatorData: uint8ArrayToBase64Url(new Uint8Array(credential.response.authenticatorData)),
                    clientDataJSON: uint8ArrayToBase64Url(new Uint8Array(credential.response.clientDataJSON)),
                    signature: uint8ArrayToBase64Url(new Uint8Array(credential.response.signature)),
                    userHandle: credential.response.userHandle ? uint8ArrayToBase64Url(new Uint8Array(credential.response.userHandle)) : null,
                },
                clientExtensionResults: credential.getClientExtensionResults ? credential.getClientExtensionResults() : {}
            };

            status.textContent = 'Confirming passkey with the server…';
            const verifyResponse = await fetch('{% url "staff_webauthn_authentication_verify" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify(payload)
            });

            const verifyData = await parseJsonResponse(verifyResponse, 'Passkey verification failed.');
            if (!verifyResponse.ok || verifyData.success === false) {
                throw new Error(verifyData.message || 'Passkey verification failed.');
            }

            if (verifyData.redirect) {
                window.location.href = verifyData.redirect;
                return;
            }

            status.textContent = verifyData.message || 'Passkey verified successfully.';
            button.disabled = true;
        } catch (error) {
            status.textContent = error.message || 'Passkey verification could not be completed.';
            status.style.color = '#b91c1c';
            button.dataset.inFlight = 'false';
            button.disabled = false;
        }
    }

    document.getElementById('verify-passkey-btn')?.addEventListener('click', verifyWithPasskey);
</script>
{% endblock %}
