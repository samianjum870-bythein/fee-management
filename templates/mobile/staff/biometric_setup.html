{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biometric Setup</title>
    <script src="{% static 'js/staff_biometric.js' %}" defer></script>
    <style>
        :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #eef2ff; color: #1f2937; }
        .setup { width: min(100%, 440px); padding: 24px; border: 1px solid #dbe3f0; border-radius: 18px; background: #fff; box-shadow: 0 18px 40px rgba(15, 23, 42, .12); text-align: center; }
        h1 { margin: 0 0 10px; font-size: 1.35rem; }
        p { margin: 0 0 18px; color: #64748b; line-height: 1.5; }
        .status { margin-bottom: 18px; font-weight: 700; }
        button { width: 100%; border: 0; border-radius: 10px; padding: 13px 16px; color: #fff; background: #4f46e5; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .65; cursor: wait; }
        .error { margin-top: 14px; color: #991b1b; background: #fef2f2; border-radius: 10px; padding: 10px; }
    </style>
</head>
<body>
    <main class="setup">
        <h1>Secure Your Staff Portal</h1>
        <p>Set up fingerprint, Face ID, or your device screen lock before using the staff portal.</p>
        <div id="biometricStatus" class="status">Biometric setup required</div>
        <button id="enableBiometricBtn" type="button">Enable Biometric</button>
        <div id="staffLoginBiometricError" class="error" hidden></div>
        {% csrf_token %}
    </main>
</body>
</html>
